services:
  - type: web

    name: attendance-notification-system

    runtime: python

    plan: free

    autoDeploy: true

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn app:app

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: PYTHONUNBUFFERED
        value: "1"