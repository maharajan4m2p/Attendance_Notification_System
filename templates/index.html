<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance Notification System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div id="particles-js"></div>

<div class="container-fluid">

<div class="row justify-content-center">

<div class="col-xl-8">

<div class="glass-card">

<div class="text-center mb-5">

<div class="logo-circle">

<i class="fa-solid fa-user-check"></i>

</div>

<h1 class="main-title">

Attendance Notification System

</h1>

<h5 class="developer">

Developed by Maharajan

</h5>

<p class="subtitle">

Upload your daily attendance Excel file and automatically identify late arrivals, missing punches, early departures, and overtime.

</p>

</div>

<form
action="/upload"
method="POST"
enctype="multipart/form-data">

<div class="upload-box">

<input
type="file"
name="attendance_file"
accept=".xlsx,.xls"
required>

<i class="fa-solid fa-file-excel excel-icon"></i>

<h4>

Drop Excel Here

</h4>

<p>

or click to browse

</p>

</div>

<div class="text-center mt-5">

<button
class="btn-analyze">

<i class="fa-solid fa-chart-line"></i>

Analyze Attendance

</button>

</div>

</form>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
